version: "3.8"

# 前后端一体单容器：Flask 同时提供 API 与 frontend/dist 静态产物。
# 部署见 docs/DEPLOY.md；生产凭证经 ${VAR:?} 强制从 .env 注入。

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stock-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:5000"
    environment:
      CACHE_DIR: /data/cache
      LOG_DIR: /data/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_DEV_PROXY: "false"
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      SCAN_MAX_WORKERS: ${SCAN_MAX_WORKERS:-20}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:?DEFAULT_ADMIN_USER must be set}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      # LLM 分析供应商（可选，舆情分析/财报解析用；按 DEEPSEEK > MINIMAX > VOLCANO 优先级取用）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      VOLCANO_API_KEY: ${VOLCANO_API_KEY:-}
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
    driver: local
