<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A股股息监测</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    header h1 { font-size: 24px; color: #1a1a2e; }
    .refresh-btn { padding: 8px 20px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .refresh-btn:hover { background: #d63850; }
    .refresh-btn:disabled { background: #ccc; cursor: not-allowed; }

    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h2 { font-size: 16px; color: #666; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #eee; }

    .indices-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .index-item { background: #f8f9fb; padding: 16px; border-radius: 8px; }
    .index-item .name { font-size: 13px; color: #888; margin-bottom: 4px; }
    .index-item .value { font-size: 22px; font-weight: 600; color: #1a1a2e; }
    .index-item .change { font-size: 13px; margin-top: 4px; }
    .index-item .change.up { color: #e94560; }
    .index-item .change.down { color: #2ecc71; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 12px; font-size: 12px; color: #888; border-bottom: 1px solid #eee; font-weight: 500; }
    td { padding: 12px; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #fafafa; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .tag-red { background: #ffeef1; color: #e94560; }
    .tag-green { background: #e8f8f0; color: #2ecc71; }

    .status { font-size: 12px; color: #888; margin-top: 12px; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .error { color: #e94560; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>A股股息率监测</h1>
      <button class="refresh-btn" onclick="refreshData()">刷新数据</button>
    </header>

    <div class="card">
      <h2>大盘指数</h2>
      <div id="indices" class="indices-grid">
        <div class="loading">加载中...</div>
      </div>
    </div>

    <div class="card">
      <h2>高股息股票 TOP 20</h2>
      <table>
        <thead>
          <tr>
            <th>代码</th>
            <th>名称</th>
            <th>最新价</th>
            <th>股息率</th>
          </tr>
        </thead>
        <tbody id="stocks">
          <tr><td colspan="4" class="loading">加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script>
    // 同域请求，Flask/Nginx 托管时自动正确
    const API_BASE = '/api';

    async function fetchJSON(url, options = {}) {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function loadIndices() {
      try {
        const data = await fetchJSON(`${API_BASE}/indices`);
        const container = document.getElementById('indices');
        if (!data || data.length === 0) {
          container.innerHTML = '<div class="error">暂无数据</div>';
          return;
        }
        container.innerHTML = data.map(idx => {
          const change = idx.change_pct || 0;
          const cls = change >= 0 ? 'up' : 'down';
          const sign = change >= 0 ? '+' : '';
          return `<div class="index-item">
            <div class="name">${idx.name || idx.symbol}</div>
            <div class="value">${idx.value || idx.current}</div>
            <div class="change ${cls}">${sign}${change.toFixed(2)}%</div>
          </div>`;
        }).join('');
      } catch (e) {
        document.getElementById('indices').innerHTML = `<div class="error">加载失败: ${e.message}</div>`;
      }
    }

    async function loadTopStocks() {
      try {
        const data = await fetchJSON(`${API_BASE}/top_stocks?limit=20`);
        const tbody = document.getElementById('stocks');
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="error">暂无数据</td></tr>';
          return;
        }
        tbody.innerHTML = data.map(s => {
          const tagCls = s.dividend_yield >= 5 ? 'tag-red' : 'tag-green';
          return `<tr>
            <td>${s.code}</td>
            <td>${s.name}</td>
            <td>${s.price}</td>
            <td><span class="tag ${tagCls}">${s.dividend_yield}%</span></td>
          </tr>`;
        }).join('');
      } catch (e) {
        document.getElementById('stocks').innerHTML = `<tr><td colspan="4" class="error">加载失败: ${e.message}</td></tr>`;
      }
    }

    async function refreshData() {
      const btn = document.querySelector('.refresh-btn');
      btn.disabled = true;
      btn.textContent = '刷新中...';
      try {
        await fetchJSON(`${API_BASE}/refresh`, { method: 'POST' });
        document.getElementById('status').textContent = '数据刷新请求已提交，请稍后刷新页面查看最新结果';
        setTimeout(() => location.reload(), 3000);
      } catch (e) {
        document.getElementById('status').textContent = '刷新失败: ' + e.message;
        btn.disabled = false;
        btn.textContent = '刷新数据';
      }
    }

    async function init() {
      await Promise.all([loadIndices(), loadTopStocks()]);
      document.getElementById('status').textContent = `更新时间: ${new Date().toLocaleString('zh-CN')}`;
    }

    init();
  </script>
</body>
</html>
